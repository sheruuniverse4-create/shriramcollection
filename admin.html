<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shri Ram Collection - Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .admin-badge {
      background: #16a34a;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .panel h2 {
      margin-bottom: 20px;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      padding: 8px 12px;
    }

    .products {
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f9fafb;
    }

    .empty {
      color: #777;
      padding: 20px 0;
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .form {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Shri Ram Collection — Admin Panel</h1>
    <span class="admin-badge">ADMIN</span>
  </div>

  <div class="container">

    <div class="stats">
      <div class="card">
        <h3>Total Products</h3>
        <div class="number" id="totalProducts">0</div>
      </div>

      <div class="card">
        <h3>Men Products</h3>
        <div class="number" id="menProducts">0</div>
      </div>

      <div class="card">
        <h3>Women Products</h3>
        <div class="number" id="womenProducts">0</div>
      </div>
    </div>

    <div class="panel">
      <h2>Add New Product</h2>

      <div class="form">

        <input id="productName" placeholder="Product name">

        <input id="productPrice" type="number" placeholder="Price">

        <select id="productCategory">
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Kids">Kids</option>
          <option value="New Arrivals">New Arrivals</option>
        </select>

        <input id="productImage" placeholder="Product image URL">

        <button class="add-btn full" onclick="addProduct()">
          + Add Product
        </button>

      </div>

      <div class="products">
        <h2>Products</h2>

        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Price</th>
              <th>Category</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="productList"></tbody>
        </table>

        <div id="emptyMessage" class="empty">
          No products added yet.
        </div>
      </div>

    </div>

  </div>

<script>

let products = [];

async function loadProducts() {
  const { data, error } = await supabase
    .from("products")
    .select("*")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  products = data || [];
  displayProducts();
}

async function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const price = document.getElementById("productPrice").value;
  const category = document.getElementById("productCategory").value;
  const image = document.getElementById("productImage").value.trim();

  if (!name || !price) {
    alert("Product name aur price bharna zaroori hai.");
    return;
  }

  const { error } = await supabase
    .from("products")
    .insert({
      name: name,
      price: Number(price),
      category: category,
      image_url: image,
      is_active: true
    });

  if (error) {
    alert("Product add nahi hua: " + error.message);
    return;
  }

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productImage").value = "";

  alert("Product added successfully.");
  loadProducts();
}

async function deleteProduct(id) {
  if (!confirm("Kya aap is product ko delete karna chahte hain?")) return;

  const { error } = await supabase
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete nahi hua: " + error.message);
    return;
  }

  loadProducts();
}

function displayProducts() {
  const list = document.getElementById("productList");
  const empty = document.getElementById("emptyMessage");

  list.innerHTML = "";

  if (products.length === 0) {
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
  }

  products.forEach(product => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${product.name}</td>
      <td>₹${product.price}</td>
      <td>${product.category}</td>
      <td>
        <button class="delete-btn" onclick="deleteProduct(${product.id})">
          Delete
        </button>
      </td>
    `;

    list.appendChild(row);
  });

  document.getElementById("totalProducts").textContent = products.length;

  document.getElementById("menProducts").textContent =
    products.filter(p => p.category === "Men").length;

  document.getElementById("womenProducts").textContent =
    products.filter(p => p.category === "Women").length;
}

window.addEventListener("load", loadProducts);

</script>

  <script>
  async function checkAdminAccess() {
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const { data: admin, error } = await supabase
      .from("admins")
      .select("user_id")
      .eq("user_id", session.user.id)
      .maybeSingle();

    if (error || !admin) {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    }
  }

  checkAdminAccess();
</script>
</body>
