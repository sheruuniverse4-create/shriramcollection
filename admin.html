<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shri Ram Collection - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .admin-badge {
      background: #16a34a;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .panel h2 {
      margin-bottom: 20px;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      padding: 8px 12px;
    }

    .products {
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f9fafb;
    }

    .empty {
      color: #777;
      padding: 20px 0;
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .form {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Shri Ram Collection — Admin Panel</h1>
    <span class="admin-badge">ADMIN</span>
  </div>

  <div class="container">

    <div class="stats">
      <div class="card">
        <h3>Total Products</h3>
        <div class="number" id="totalProducts">0</div>
      </div>

      <div class="card">
        <h3>Men Products</h3>
        <div class="number" id="menProducts">0</div>
      </div>

      <div class="card">
        <h3>Women Products</h3>
        <div class="number" id="womenProducts">0</div>
      </div>
    </div>

    <div class="panel">
      <h2>Add New Product</h2>

      <div class="form">
        <input id="productName" placeholder="Product name">
        <input id="productPrice" type="number" placeholder="Price">
        <select id="productCategory">
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Kids">Kids</option>
          <option value="New Arrivals">New Arrivals</option>
        </select>
        <input id="productImage" type="file" accept="image/*">

        <button class="add-btn full" onclick="addProduct()">
          + Add Product
        </button>
      </div>

      <div class="products">
        <h2>Products</h2>

        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Price</th>
              <th>Category</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="productList"></tbody>
        </table>

        <div id="emptyMessage" class="empty">
          No products added yet.
        </div>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://zyreggzaomelsfddbibs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5cmVnZ3phb21lbHNmZGRiaWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwOTY2NDMsImV4cCI6MjEwNjY3MjY0M30.11nIKv060IIgvxQWScL1NjMhrmXQF50jRCkMIDCsGmg";

   const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let products = [];

async function checkAdminAccess() {
  const { data, error } = await sb.auth.getSession();

  if (error || !data.session) {
    window.location.href = "login.html";
    return false;
  }

  const { data: admin, error: adminError } = await sb
    .from("admins")
    .select("user_id")
    .eq("user_id", data.session.user.id)
    .maybeSingle();

  if (adminError || !admin) {
    await sb.auth.signOut();
    window.location.href = "login.html";
    return false;
  }

  return true;
}

async function loadProducts() {
  const { data, error } = await sb
    .from("products")
    .select("*")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {
    alert("Products load nahi hue: " + error.message);
    console.error(error);
    return;
  }

  products = data || [];
  displayProducts();
}
let orders = [];

async function loadOrders() {
  const { data, error } = await sb
    .from("order")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Orders load error:", error);
    return;
  }

  orders = data || [];
  displayOrders();
}

function displayOrders() {
  const list = document.getElementById("orderList");
  const empty = document.getElementById("orderEmptyMessage");

  list.innerHTML = "";

  if (orders.length === 0) {
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  orders.forEach(order => {
    const row = document.createElement("tr");

    [
      order.name,
      order.mobile,
      order.alternate_mobile,
      order.address,
      order.size,
      order.quantity,
      "₹" + (order.price || 0),
      new Date(order.created_at).toLocaleString("en-IN")
    ].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value || "";
      row.appendChild(td);
    });
const statusTd = document.createElement("td");

const select = document.createElement("select");

["Pending", "Confirmed", "Shipped", "Out for Delivery", "Delivered", "Cancelled"]
.forEach(status => {
  const option = document.createElement("option");
  option.value = status;
  option.textContent = status;

  if ((order.status || "Pending") === status) {
    option.selected = true;
  }

  select.appendChild(option);
});

select.onchange = async () => {
  const { error } = await sb
    .from("order")
    .update({ status: select.value })
    .eq("id", order.id);

  if (error) {
    alert("Status update nahi hua");
    console.error(error);
    return;
  }

  order.status = select.value;
};

statusTd.appendChild(select);
row.appendChild(statusTd);
    list.appendChild(row);
  });
}
async function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const price = document.getElementById("productPrice").value;
  const category = document.getElementById("productCategory").value;
 const imageFile = document.getElementById("productImage").files[0];
  if (!imageFile) {
  alert("Product image select karna zaroori hai.");
  return;
}
  if (!name || !price) {
    alert("Product name aur price bharna zaroori hai.");
    return;
  }
const fileName = `${Date.now()}-${imageFile.name}`;

const { error: uploadError } = await sb.storage
  .from("product_image")
  .upload(fileName, imageFile);

if (uploadError) {
  alert("Image upload nahi hui.");
  console.error(uploadError);
  return;
}

const { data: imageData } = sb.storage
  .from("product_image")
  .getPublicUrl(fileName);

const image = imageData.publicUrl;
  const { error } = await sb
    .from("products")
    .insert({
      name: name,
      price: Number(price),
      category: category,
      image_url: image,
      is_active: true
    });

  if (error) {
    alert("Product add nahi hua: " + error.message);
    console.error(error);
    return;
  }

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productImage").value = "";

  alert("Product added successfully.");
  await loadProducts();
}

async function deleteProduct(id) {
  if (!confirm("Kya aap is product ko delete karna chahte hain?")) {
    return;
  }

  const { error } = await sb
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete nahi hua: " + error.message);
    return;
  }

  await loadProducts();
}

function displayProducts() {
  const list = document.getElementById("productList");
  const empty = document.getElementById("emptyMessage");

  list.innerHTML = "";

  empty.style.display =
    products.length === 0 ? "block" : "none";

  products.forEach(product => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${product.name}</td>
      <td>₹${product.price}</td>
      <td>${product.category}</td>
      <td>
        <button
          class="delete-btn"
          onclick="deleteProduct(${product.id})">
          Delete
        </button>
      </td>
    `;

    list.appendChild(row);
  });

  document.getElementById("totalProducts").textContent =
    products.length;

  document.getElementById("menProducts").textContent =
    products.filter(p => p.category === "Men").length;

  document.getElementById("womenProducts").textContent =
    products.filter(p => p.category === "Women").length;
}

window.addProduct = addProduct;
window.deleteProduct = deleteProduct;

window.addEventListener("load", async () => {
  const isAdmin = await checkAdminAccess();

  if (isAdmin) {
    await loadProducts();
    await loadOrders();
  }
});
  </script>

  <h2>Orders</h2>

  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>Customer Name</th>
          <th>Mobile</th>
          <th>Alternate Mobile</th>
          <th>Address</th>
          <th>Size</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Order Date</th>
        </tr>
      </thead>

      <tbody id="orderList"></tbody>
    </table>
  </div>

  <p id="orderEmptyMessage" style="text-align:center;">
    No orders yet.
  </p>
</div>
</body>
