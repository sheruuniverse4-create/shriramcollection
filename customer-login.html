<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Login - Shri Ram Collection</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f3ed;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      color: #222;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .google-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #222;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .google-btn:hover {
      background: #f5f5f5;
    }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      margin-top: 18px;
      color: #c00;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Shri Ram Collection</h1>

    <div class="subtitle">
      Customer Login
    </div>

    <button class="google-btn" id="googleLoginBtn" >
      Continue with Google
    </button>

    <div id="message"></div>

    <a href="index.html" class="back-btn">
      ← Back to Website
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://zyreggzaomelsfddbibs.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_gNzfXDlTuBD2K2Stiu4iyQ_c4n247pY";

    const sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function googleLogin() {

      document.getElementById("message").textContent =
        "Opening Google login...";

      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo:
            window.location.origin +
            "/shriramcollection/customer-login.html"
        }
      });

      if (error) {
        console.error(error);

        document.getElementById("message").textContent =
          "Google login failed. Please try again.";
      }
    }

    document
      .getElementById("googleLoginBtn")
      .addEventListener("click", googleLogin);


   

  async function checkCustomerLogin() {
  const { data: { session } } = await sb.auth.getSession();

  if (session) {
    window.location.href = "index.html";
  }
}

sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    window.location.href = "index.html";
  }
});

checkCustomerLogin();    
  </script>

</body>
</html>
