<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shri Ram Collection - Customer Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    .google-btn {
      background: white;
      color: #111827;
      border: 1px solid #ccc;
    }

    .google-btn:hover {
      background: #f5f5f5;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #c00;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111827;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Shri Ram Collection</h1>

    <div class="subtitle">
      Customer Login
    </div>

    <button class="google-btn" id="googleLoginBtn">
      Continue with Google
    </button>

    <div id="message"></div>

    <a href="index.html" class="back-btn">
      ← Back to Website
    </a>

  </div>

<script>

const SUPABASE_URL =
  "https://zyreggzaomelsfddbibs.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_gNzfXDlTuBD2K2Stiu4iyQ_c4n247pY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


// =========================
// GOOGLE CUSTOMER LOGIN
// =========================

async function googleLogin() {

  const message =
    document.getElementById("message");

  message.style.color = "#555";
  message.textContent =
    "Google login opening...";

  const { error } =
    await supabaseClient.auth.signInWithOAuth({
      provider: "google",

      options: {
        redirectTo:
          "https://sheruuniverse4-create.github.io/shriramcollection/customer-login.html"
      }
    });

if (error) {

    message.style.color = "#c00";

    message.textContent =
      "Google login failed: " +
      error.message;
  }
}


// =========================
// GOOGLE LOGIN BUTTON
// =========================

document
  .getElementById("googleLoginBtn")
  .addEventListener(
    "click",
    googleLogin
  );


// =========================
// CHECK LOGIN
// =========================

async function checkGoogleLogin() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) {
    console.error(error);
    return;
  }

  if (!data.session) {
    return;
  }

  // Google login successful
  window.location.href = "index.html";
}

checkGoogleLogin();

</script>

</body>
</html>
