<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shri Ram Collection - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    .google-btn {
      background: white;
      color: #111827;
      border: 1px solid #ccc;
    }

    .google-btn:hover {
      background: #f5f5f5;
    }

    .admin-btn {
      background: #111827;
      color: white;
    }

    .admin-btn:hover {
      background: #000;
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      color: #888;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #c00;
    }

    .admin-title {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Shri Ram Collection</h1>

    <div class="subtitle">
      Customer Login
    </div>

    <button class="google-btn" onclick="googleLogin()">
      Continue with Google
    </button>

    <div class="divider">— Admin Login —</div>

    <div class="admin-title">
      Owner/Admin access only
    </div>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button class="admin-btn" onclick="adminLogin()">
      Admin Login
    </button>

    <div id="message"></div>

  </div>

<script>
const SUPABASE_URL = "https://zyreggzaomelsfddbibs.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_gNzfXDlTuBD2K2Stiu4iyQ_c4n247pY";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// =========================
// GOOGLE CUSTOMER LOGIN
// =========================

async function googleLogin() {

  const message = document.getElementById("message");
  message.style.color = "#c00";
  message.textContent = "Google login opening...";

  const { error } =
    await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo:
          window.location.origin +
          "/shriramcollection/login.html"
      }
    });

  if (error) {
    message.textContent =
      "Google login failed: " + error.message;
  }
}


// =========================
// ADMIN EMAIL/PASSWORD LOGIN
// =========================

async function adminLogin() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  message.style.color = "#c00";
  message.textContent = "";

  if (!email || !password) {
    message.textContent =
      "Email aur password dono bharo.";
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent =
      "Login failed: " + error.message;
    return;
  }

  const { data: admin, error: adminError } =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();

  if (adminError || !admin) {

    await supabaseClient.auth.signOut();

    message.textContent =
      "Access denied. Admin account required.";

    return;
  }

  window.location.href = "admin.html";
}


// =========================
// CHECK GOOGLE LOGIN
// =========================

async function checkGoogleLogin() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (!data.session) {
    return;
  }

  const user = data.session.user;

  // Agar admin account Google se login kare
  const { data: admin } =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

  if (admin) {
    window.location.href = "admin.html";
    return;
  }

  // Normal customer
  window.location.href = "index.html";
}

checkGoogleLogin();

</script>

</body>
</html>
