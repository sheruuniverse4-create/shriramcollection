<!-- Admin login page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shri Ram Collection - Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #000;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #c00;
      min-height: 20px;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111827;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Shri Ram Collection</h1>

    <div class="subtitle">
      Admin Login
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Admin Login
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back-btn">
      ← Back to Website
    </a>

  </div>

<script>

const SUPABASE_URL =
  "https://zyreggzaomelsfddbibs.supabase.co";

/*
  IMPORTANT:
  Yahan apna EXISTING PUBLIC/PUBLISHABLE Supabase key rakho.
  Secret/service key kabhi mat lagana.
*/
const SUPABASE_ANON_KEY =
  "sb_publishable_gNzfXDlTuBD2K2Stiu4iyQ_c4n247pY";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


async function adminLogin() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  message.textContent = "Logging in...";


  const { data, error } =
    await sb.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    console.error(error);

    message.textContent =
      "Login failed: " + error.message;

    return;
  }


  const user =
    data.user;


  if (!user) {

    message.textContent =
      "Login failed.";

    return;
  }


  const { data: admin, error: adminError } =
    await sb
      .from("admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  if (adminError) {

    console.error(adminError);

    await sb.auth.signOut();

    message.textContent =
      "Admin verification failed.";

    return;
  }


  if (!admin) {

    await sb.auth.signOut();

    message.textContent =
      "Access denied. You are not an admin.";

    return;
  }


  window.location.href =
    "admin.html";
}


document
  .getElementById("loginForm")
  .addEventListener("submit", function(event) {

    event.preventDefault();

    adminLogin();

  });

</script>

</body>
</html>
